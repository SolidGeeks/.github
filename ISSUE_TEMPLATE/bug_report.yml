name: Bug report
description: Something is broken. Tell us what happened.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ![Found a bug? Let's fix it.](https://raw.githubusercontent.com/SolidGeeks/.github/main/assets/banners/bug.png)

        **Security issue?** Don't file it here. Use [a private security advisory](../security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit hash.
      placeholder: v0.5.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, browser, runtime version
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant output. Remove secrets first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before you post
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
